<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0a0f">
<title>هپی برف دی 🎂</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎂%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
:root { --bg:#0a0a0f; --text:#f4f4f8; --muted:#a8a8b8; --gold:#ffd36e; --pink:#ff7eb6; --cyan:#7ee0ff; --violet:#a98bff; }
* { box-sizing:border-box; margin:0; padding:0; }
html, body { min-height:100%; }
body {
    background:var(--bg); color:var(--text);
    font-family:'Vazirmatn', Tahoma, 'Segoe UI', sans-serif;
    overflow-x:hidden; -webkit-tap-highlight-color:transparent;
}
body::before, body::after {
    content:""; position:fixed; z-index:0; width:90vmax; height:90vmax; border-radius:50%;
    pointer-events:none; will-change:transform;
}
body::before { top:-55vmax; right:-35vmax; background:radial-gradient(circle, rgba(169,139,255,.20), transparent 62%); animation:drift 22s ease-in-out infinite alternate; }
body::after  { bottom:-60vmax; left:-40vmax; background:radial-gradient(circle, rgba(255,126,182,.16), transparent 62%); animation:drift 28s ease-in-out infinite alternate-reverse; }
@keyframes drift { to { transform:translate3d(8vmax,5vmax,0) scale(1.1); } }

canvas { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; }
#stars { z-index:0; }
#fx { z-index:5; }

/* ---------- gift screen ---------- */
#gift {
    position:fixed; inset:0; z-index:20; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px;
    background:radial-gradient(ellipse at 50% 35%, #1a1a30 0%, var(--bg) 65%);
    transition:opacity .7s ease, visibility 0s .7s;
}
#gift.gone { opacity:0; visibility:hidden; pointer-events:none; }
.gift-btn { background:none; border:0; cursor:pointer; width:min(240px, 62vw); }
.gift-btn:focus-visible { outline:2px solid var(--gold); outline-offset:8px; border-radius:20px; }
.gift-svg { width:100%; height:auto; overflow:visible; animation:giftWiggle 2.2s ease-in-out infinite; filter:drop-shadow(0 18px 40px rgba(255,211,110,.25)); }
.gift-svg #lid { transform-box:fill-box; transform-origin:center; }
#gift.open .gift-svg { animation:none; }
#gift.open #lid { animation:lidOff .6s cubic-bezier(.3,1.4,.5,1) forwards; }
#gift.open .beam { opacity:1; }
.beam { opacity:0; transition:opacity .3s; }
.gift-hint { color:var(--muted); font-size:1.05rem; animation:pulse 1.8s ease-in-out infinite; }
.gift-hint b { color:var(--gold); font-weight:800; }
@keyframes giftWiggle { 0%,60%,100% { transform:rotate(0); } 66% { transform:rotate(-4deg) scale(1.03); } 72% { transform:rotate(4deg) scale(1.03); } 78% { transform:rotate(-3deg); } 84% { transform:rotate(2deg); } }
@keyframes lidOff { to { transform:translateY(-90px) rotate(-16deg); opacity:0; } }
@keyframes pulse { 50% { opacity:.45; } }
#flash { position:fixed; inset:0; z-index:30; background:#fff; opacity:0; pointer-events:none; }
#flash.go { animation:flash .7s ease-out; }
@keyframes flash { 0% { opacity:.85; } 100% { opacity:0; } }

/* ---------- main scene ---------- */
main {
    position:relative; z-index:1; min-height:100vh; min-height:100dvh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:16px; padding:56px 18px 40px; text-align:center; visibility:hidden;
}
body.on main { visibility:visible; }
.reveal { opacity:0; }
body.on .reveal { animation:rise .9s var(--d, 0s) cubic-bezier(.2,.8,.2,1) forwards; }
@keyframes rise { from { opacity:0; transform:translateY(18px) scale(.97); } to { opacity:1; transform:none; } }

.kicker { color:var(--muted); font-size:1rem; letter-spacing:.02em; }
h1 {
    font-size:clamp(2.8rem, 13vw, 6rem); font-weight:900; line-height:1.25;
    background:linear-gradient(100deg, #fff 0%, var(--gold) 25%, var(--pink) 50%, var(--violet) 75%, #fff 100%);
    background-size:240% 100%; -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:shimmer 6s linear infinite; filter:drop-shadow(0 6px 30px rgba(255,126,182,.25));
}
body.on h1.reveal { animation:rise .9s var(--d,0s) cubic-bezier(.2,.8,.2,1) forwards, shimmer 6s linear infinite; }
@keyframes shimmer { to { background-position:-240% 0; } }

.wish {
    position:relative; max-width:560px; padding:24px 26px; border-radius:22px; line-height:2.1; font-size:clamp(1rem, 4.2vw, 1.2rem);
    background:linear-gradient(160deg, rgba(255,255,255,.08), rgba(255,255,255,.03));
    border:1px solid rgba(255,255,255,.12); backdrop-filter:none;
    box-shadow:0 20px 60px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.08);
}
.wish::before { content:"✦"; position:absolute; top:-14px; right:24px; color:var(--gold); font-size:1.4rem; text-shadow:0 0 18px var(--gold); }
.hl { color:var(--gold); font-weight:800; display:inline-block; text-decoration:underline wavy rgba(255,211,110,.7); text-underline-offset:6px; animation:wob 2.4s ease-in-out infinite; }
@keyframes wob { 50% { transform:translateY(-3px) rotate(-2deg); } }
.sign { display:block; margin-top:12px; color:var(--pink); font-weight:800; font-size:1.05rem; }

.cake-wrap { margin-top:4px; }
.cake { width:min(250px, 66vw); height:auto; overflow:visible; cursor:pointer; touch-action:manipulation; }
.flame { transform-box:fill-box; transform-origin:50% 100%; animation:flicker 1.1s ease-in-out infinite; transition:opacity .3s ease; }
.f2 { animation-delay:-.4s; } .f3 { animation-delay:-.8s; }
.glow { transition:opacity .3s ease; }
.cake.out .flame, .cake.out .glow { opacity:0; animation:none; }
.smoke { opacity:0; }
.cake.out .smoke { animation:smoke 1.8s ease-out forwards; }
.cake.out .s2 { animation-delay:.15s; } .cake.out .s3 { animation-delay:.3s; }
@keyframes flicker { 0%,100% { transform:scale(1) rotate(-3deg); } 50% { transform:scale(1.1,1.2) rotate(3deg); } }
@keyframes smoke { 0% { opacity:.7; transform:translateY(0); } 100% { opacity:0; transform:translateY(-38px); } }

.row { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; }
.btn {
    font:inherit; font-weight:700; font-size:.98rem; color:#15110a; background:var(--gold); border:0; border-radius:999px;
    padding:11px 20px; cursor:pointer; box-shadow:0 8px 26px rgba(255,211,110,.22); transition:transform .15s ease;
}
.btn.alt { color:var(--text); background:rgba(255,255,255,.09); border:1px solid rgba(255,255,255,.16); box-shadow:none; }
.btn:hover { transform:translateY(-2px); }
.btn:active { transform:scale(.96); }
.btn:focus-visible, .chip:focus-visible { outline:2px solid #fff; outline-offset:3px; }

.chip {
    position:fixed; top:14px; z-index:6; font:inherit; color:var(--text); font-weight:700; font-size:.95rem;
    padding:7px 14px; border-radius:999px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.14);
    opacity:0; visibility:hidden; transition:opacity .6s ease;
}
body.on .chip { opacity:1; visibility:visible; }
#count { right:14px; cursor:default; }
#snd { left:14px; cursor:pointer; }

.tip { color:var(--muted); font-size:.85rem; }

/* ---------- balloons ---------- */
.balloon {
    position:fixed; z-index:3; bottom:-130px; width:var(--s); height:calc(var(--s) * 1.2); cursor:pointer; touch-action:manipulation;
    border-radius:50% 50% 48% 48% / 58% 58% 42% 42%;
    background:radial-gradient(circle at 32% 26%, rgba(255,255,255,.55), transparent 26%), linear-gradient(160deg, var(--c1), var(--c2));
    box-shadow:inset -6px -8px 16px rgba(0,0,0,.18);
    animation:fly var(--dur) linear forwards; will-change:transform;
}
.balloon::before { content:""; position:absolute; left:50%; top:calc(100% - 1px); margin-left:-5px; border:5px solid transparent; border-bottom-color:var(--c2); border-top:0; }
.balloon::after { content:""; position:absolute; left:50%; top:100%; width:1.5px; height:54px; background:rgba(255,255,255,.35); }
@keyframes fly {
    0% { transform:translate3d(0,0,0); }
    25% { transform:translate3d(var(--sway),calc((-100vh - 280px) * .25),0); }
    50% { transform:translate3d(calc(var(--sway) * -1),calc((-100vh - 280px) * .5),0); }
    75% { transform:translate3d(var(--sway),calc((-100vh - 280px) * .75),0); }
    100% { transform:translate3d(0,calc(-100vh - 280px),0); }
}
.pw {
    position:fixed; z-index:7; pointer-events:none; font-weight:800; font-size:1.15rem; white-space:nowrap; transform:translate(-50%,-50%);
    text-shadow:0 2px 14px rgba(0,0,0,.6); animation:pw 1.4s ease-out forwards;
}
@keyframes pw { 0% { opacity:0; transform:translate(-50%,-30%) scale(.7); } 15% { opacity:1; transform:translate(-50%,-60%) scale(1.1); } 100% { opacity:0; transform:translate(-50%,-190%) scale(1); } }

#toast {
    position:fixed; z-index:8; left:50%; bottom:26px; transform:translate(-50%,20px); opacity:0; pointer-events:none;
    padding:11px 20px; border-radius:999px; background:rgba(20,20,34,.92); border:1px solid rgba(255,255,255,.16);
    font-weight:700; transition:opacity .3s ease, transform .3s ease; max-width:92vw; text-align:center;
}
#toast.show { opacity:1; transform:translate(-50%,0); }

@media (prefers-reduced-motion: reduce) {
    body::before, body::after, h1, .gift-svg, .flame, .hl, .gift-hint { animation:none !important; }
    body.on .reveal { animation:none !important; opacity:1; }
}
</style>
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="flash" aria-hidden="true"></div>

<!-- gift -->
<section id="gift">
    <button class="gift-btn" id="giftBtn" type="button" aria-label="باز کردن هدیه">
        <svg class="gift-svg" viewBox="0 0 220 220" aria-hidden="true">
            <ellipse cx="110" cy="206" rx="86" ry="9" fill="#000" opacity=".4"/>
            <g class="beam"><path d="M110 90 L40 -40 L180 -40 Z" fill="#ffd36e" opacity=".22"/></g>
            <rect x="30" y="98" width="160" height="104" rx="10" fill="#7a5cff"/>
            <rect x="30" y="98" width="160" height="14" fill="#000" opacity=".12"/>
            <rect x="98" y="98" width="24" height="104" fill="#ffd36e"/>
            <g id="lid">
                <rect x="20" y="68" width="180" height="40" rx="10" fill="#9a82ff"/>
                <rect x="98" y="68" width="24" height="40" fill="#ffe08f"/>
                <path d="M110 68 C84 34 54 44 70 64 C80 74 100 70 110 68 Z" fill="#ff7eb6"/>
                <path d="M110 68 C136 34 166 44 150 64 C140 74 120 70 110 68 Z" fill="#ff7eb6"/>
                <circle cx="110" cy="66" r="9" fill="#ffd36e"/>
            </g>
        </svg>
    </button>
    <p class="gift-hint">یه هدیه برات دارم 🎁 <b>بزن روش</b></p>
</section>

<button class="chip" id="count" type="button" tabindex="-1" aria-live="polite">🎈 ۰</button>
<button class="chip" id="snd" type="button" aria-label="قطع و وصل صدا">🔊</button>

<main>
    <p class="kicker reveal" id="kicker" style="--d:.1s">یه پیام مخصوص برای تو ✦</p>
    <h1 class="reveal" style="--d:.25s">هپی برف دی 🎂</h1>

    <section class="wish reveal" style="--d:.6s">
        <p>تولدت مبارک ایشالا که به همه‌ی آرزوهام <span class="hl">(برسم)</span> و مدرسه تعطیل بشه و دیگه باز نشه 😂</p>
        <span class="sign">از طرف ارنیا جمبرزمین</span>
    </section>

    <div class="cake-wrap reveal" style="--d:.95s">
        <svg class="cake" id="cake" viewBox="0 0 260 230" role="img" aria-label="کیک تولد با سه شمع روشن">
            <ellipse cx="130" cy="216" rx="112" ry="12" fill="#000" opacity=".35"/>
            <rect x="26" y="152" width="208" height="60" rx="14" fill="#e8b4c8"/>
            <rect x="26" y="152" width="208" height="16" rx="8" fill="#fff" opacity=".85"/>
            <rect x="52" y="106" width="156" height="52" rx="12" fill="#f7d58a"/>
            <rect x="52" y="106" width="156" height="14" rx="7" fill="#fff" opacity=".85"/>
            <circle cx="80" cy="188" r="5" fill="#fff" opacity=".8"/>
            <circle cx="130" cy="192" r="5" fill="#fff" opacity=".8"/>
            <circle cx="180" cy="188" r="5" fill="#fff" opacity=".8"/>
            <rect x="84" y="76" width="10" height="34" rx="3" fill="#8fd3ff"/>
            <rect x="125" y="70" width="10" height="40" rx="3" fill="#ff9ec7"/>
            <rect x="166" y="76" width="10" height="34" rx="3" fill="#b9a4ff"/>
            <circle class="glow" cx="89" cy="62" r="24" fill="#ffd36e" opacity=".16"/>
            <circle class="glow" cx="130" cy="56" r="26" fill="#ffd36e" opacity=".18"/>
            <circle class="glow" cx="171" cy="62" r="24" fill="#ffd36e" opacity=".16"/>
            <path class="flame f1" d="M89 50 C96 58 97 65 89 73 C81 65 82 58 89 50 Z" fill="#ffb347"/>
            <path class="flame f2" d="M130 44 C138 53 139 61 130 70 C121 61 122 53 130 44 Z" fill="#ffb347"/>
            <path class="flame f3" d="M171 50 C178 58 179 65 171 73 C163 65 164 58 171 50 Z" fill="#ffb347"/>
            <path class="smoke s1" d="M89 70 C85 60 93 54 89 44" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>
            <path class="smoke s2" d="M130 64 C126 54 134 48 130 38" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>
            <path class="smoke s3" d="M171 70 C167 60 175 54 171 44" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>
        </svg>
    </div>

    <div class="row reveal" style="--d:1.15s">
        <button class="btn" id="blow" type="button">فوت کن! 🎂</button>
        <button class="btn alt" id="mic" type="button">🎤 با میکروفون فوت کن</button>
        <button class="btn alt" id="fire" type="button">🎆 آتش‌بازی</button>
    </div>
    <p class="tip reveal" style="--d:1.3s">بادکنک‌ها رو بترکون 🎈 هرجا هم بزنی آتش‌بازی می‌شه</p>
</main>

<div id="toast" role="status"></div>

<script>
const $ = s => document.querySelector(s);
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const fa = n => n.toLocaleString('fa-IR');
const rand = (a, b) => a + Math.random() * (b - a);

/* optional: open the page with ?name=علی to personalise the little line on top */
const qn = new URLSearchParams(location.search).get('name');
if (qn) $('#kicker').textContent = 'برای ' + qn.slice(0, 30) + ' ✦';

/* ---------- sound (tiny synth, no files) ---------- */
let soundOn = true, actx = null;
function ac() {
    if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (actx && actx.state === 'suspended') actx.resume();
    return actx;
}
function tone(freq, t0, dur, type, vol) {
    const a = ac(); if (!a || !soundOn) return;
    const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + t0;
    o.type = type || 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol || .1, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + .05);
}
function noise(dur, vol, lp) {
    const a = ac(); if (!a || !soundOn) return;
    const n = Math.floor(a.sampleRate * dur), buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3);
    const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    s.buffer = buf; f.type = 'lowpass'; f.frequency.value = lp; g.gain.value = vol;
    s.connect(f); f.connect(g); g.connect(a.destination); s.start();
}
const sfx = {
    pop()   { noise(.12, .5, 6000); tone(rand(500, 800), 0, .08, 'triangle', .05); },
    boom()  { noise(.55, .5, 900); },
    chime() { [523, 659, 784, 1047].forEach((f, i) => tone(f, i * .09, .55, 'sine', .09)); },
    fan()   { [392, 523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, i * .08, .6, 'triangle', .07)); }
};
$('#snd').addEventListener('click', e => {
    soundOn = !soundOn; e.currentTarget.textContent = soundOn ? '🔊' : '🔇';
    e.stopPropagation();
});

/* ---------- toast ---------- */
let toastT;
function toast(msg, ms) {
    const t = $('#toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), ms || 2200);
}

/* ---------- twinkling stars + rare shooting star ---------- */
(function () {
    const c = $('#stars'), ctx = c.getContext('2d');
    let w, h, st = [], shoot = null, next = performance.now() + 5000, last = 0;
    function size() {
        w = c.width = innerWidth; h = c.height = innerHeight;
        st = Array.from({ length: Math.min(170, Math.round(w * h / 9000)) }, () => ({
            x: Math.random() * w, y: Math.random() * h, r: .3 + Math.pow(Math.random(), 3) * 1.6,
            p: Math.random() * 6.28, s: .5 + Math.random() * 1.2
        }));
    }
    addEventListener('resize', size); size();
    function draw(t) {
        if (!REDUCED) requestAnimationFrame(draw);
        if (t - last < 25) return; last = t;
        ctx.clearRect(0, 0, w, h);
        for (const s of st) {
            const a = REDUCED ? .7 : .3 + .6 * (.5 + .5 * Math.sin(t * .001 * s.s + s.p));
            ctx.fillStyle = 'rgba(255,255,255,' + a.toFixed(2) + ')';
            ctx.fillRect(s.x, s.y, s.r * 1.6, s.r * 1.6);
        }
        if (REDUCED) return;
        if (!shoot && t > next) {
            const dir = Math.random() < .5 ? -1 : 1, v = Math.max(w, 600) * rand(.7, 1.1);
            shoot = { x: w * (dir > 0 ? rand(.1, .5) : rand(.5, .9)), y: h * rand(.05, .3), vx: dir * v, vy: v * rand(.3, .5), t: 0 };
        }
        if (shoot) {
            shoot.t += .025; shoot.x += shoot.vx * .025; shoot.y += shoot.vy * .025;
            const f = shoot.t / .9;
            if (f >= 1) { shoot = null; next = t + rand(8000, 16000); }
            else {
                const g = ctx.createLinearGradient(shoot.x, shoot.y, shoot.x - shoot.vx * .13, shoot.y - shoot.vy * .13);
                g.addColorStop(0, 'rgba(255,255,255,' + (Math.sin(Math.PI * f) * .85).toFixed(2) + ')'); g.addColorStop(1, 'rgba(255,255,255,0)');
                ctx.strokeStyle = g; ctx.lineWidth = 1.5; ctx.lineCap = 'round';
                ctx.beginPath(); ctx.moveTo(shoot.x, shoot.y); ctx.lineTo(shoot.x - shoot.vx * .13, shoot.y - shoot.vy * .13); ctx.stroke();
            }
        }
    }
    requestAnimationFrame(draw);
})();

/* ---------- confetti + fireworks (one shared canvas) ---------- */
const FX = (function () {
    const c = $('#fx'), ctx = c.getContext('2d');
    const COLORS = ['#ffd36e', '#ff7eb6', '#7ee0ff', '#a98bff', '#8affc1', '#ffffff'];
    let W, H, bits = [], sparks = [], rockets = [], running = false, prev = 0;
    function size() { W = c.width = innerWidth; H = c.height = innerHeight; }
    addEventListener('resize', size); size();
    function kick() { if (!running) { running = true; prev = performance.now(); requestAnimationFrame(step); } }

    function confetti(x, y, n) {
        if (REDUCED) return;
        for (let i = 0; i < n; i++) {
            const a = Math.random() * 6.283, v = rand(4, 13);
            bits.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 5, w: rand(6, 12), h: rand(3, 7),
                rot: Math.random() * 6.28, vr: rand(-.2, .2), col: COLORS[(Math.random() * COLORS.length) | 0], life: 1 });
        }
        kick();
    }
    function explode(x, y) {
        if (REDUCED) return;
        const hue = Math.random() * 360, n = 70 + (Math.random() * 30 | 0);
        for (let i = 0; i < n; i++) {
            const a = Math.random() * 6.283, v = rand(1.2, 6);
            sparks.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1, decay: rand(.008, .018),
                hue: hue + rand(-25, 25), size: rand(1.4, 2.8) });
        }
        sfx.boom(); kick();
    }
    function launch() {
        if (REDUCED) return;
        rockets.push({ x: rand(W * .15, W * .85), y: H + 10, ty: H * rand(.12, .42), vy: -rand(9, 13) });
        kick();
    }
    function step(now) {
        const k = Math.min(2.2, (now - prev) / 16.7); prev = now;
        ctx.clearRect(0, 0, W, H);

        for (let i = rockets.length - 1; i >= 0; i--) {
            const r = rockets[i]; r.y += r.vy * k;
            ctx.fillStyle = '#ffe9a8'; ctx.fillRect(r.x - 1.5, r.y, 3, 10);
            if (r.y <= r.ty) { explode(r.x, r.y); rockets.splice(i, 1); }
        }
        sparks = sparks.filter(s => s.life > 0 && s.y < H + 20);
        for (const s of sparks) {
            s.vy += .06 * k; s.vx *= .985; s.vy *= .985; s.x += s.vx * k; s.y += s.vy * k; s.life -= s.decay * k;
            ctx.strokeStyle = 'hsla(' + s.hue + ',100%,68%,' + Math.max(0, s.life).toFixed(2) + ')';
            ctx.lineWidth = s.size; ctx.lineCap = 'round';
            ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x - s.vx * 2.2, s.y - s.vy * 2.2); ctx.stroke();
        }
        bits = bits.filter(p => p.life > 0 && p.y < H + 20);
        for (const p of bits) {
            p.vy += .22 * k; p.vx *= .992; p.x += p.vx * k; p.y += p.vy * k; p.rot += p.vr * k; p.life -= .004 * k;
            ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
            ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 1.6)); ctx.fillStyle = p.col;
            ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
        }
        if (bits.length || sparks.length || rockets.length) requestAnimationFrame(step);
        else { running = false; ctx.clearRect(0, 0, W, H); }
    }
    return { confetti, explode, launch, size: () => ({ W, H }) };
})();
function show(fn, list) { list.forEach((ms, i) => setTimeout(fn, ms)); }

/* ---------- balloons ---------- */
const COLS = [['#ff7eb6', '#d63384'], ['#7ee0ff', '#1b8fc4'], ['#ffd36e', '#e0a100'], ['#a98bff', '#6c47e0'], ['#8affc1', '#1fb571'], ['#ff9f7e', '#e0562b']];
const WISHES = ['مدرسه تعطیل! 🏖️', 'هپی برف دی! 🎉', 'آرزوهات برآورده شه ✨', 'بدون امتحان 😎', 'یه سال بزرگ‌تر شدی 👴', 'کادوت کو؟ 🎁', 'ایشالا باز نشه 🚫'];
let alive = 0, pops = 0, balloonTimer = null;

function spawnBalloon() {
    if (document.hidden || alive >= 9 || REDUCED) return;
    const [c1, c2] = COLS[(Math.random() * COLS.length) | 0];
    const el = document.createElement('div'), s = rand(52, 88);
    el.className = 'balloon';
    el.style.cssText = '--s:' + s.toFixed(0) + 'px;--c1:' + c1 + ';--c2:' + c2 + ';--dur:' + rand(8, 13).toFixed(1) + 's;--sway:' + rand(14, 40).toFixed(0) + 'px;left:' + rand(3, 88).toFixed(1) + 'vw';
    el.addEventListener('pointerdown', e => { e.stopPropagation(); popBalloon(el, e.clientX, e.clientY); });
    el.addEventListener('animationend', () => { if (el.isConnected) { el.remove(); alive--; } });
    document.body.appendChild(el); alive++;
}
function popBalloon(el, x, y) {
    if (!el.isConnected) return;
    el.remove(); alive--; pops++;
    sfx.pop(); FX.confetti(x, y, 26);
    const t = document.createElement('div');
    t.className = 'pw'; t.textContent = WISHES[(Math.random() * WISHES.length) | 0];
    t.style.left = Math.min(Math.max(x, 90), innerWidth - 90) + 'px'; t.style.top = y + 'px';
    t.style.color = COLS[(Math.random() * COLS.length) | 0][0];
    document.body.appendChild(t); setTimeout(() => t.remove(), 1500);
    $('#count').textContent = '🎈 ' + fa(pops);
    if (pops % 10 === 0) { toast('🏆 ' + fa(pops) + ' تا ترکوندی!'); FX.launch(); setTimeout(FX.launch, 250); sfx.fan(); }
}

/* ---------- candles ---------- */
const cake = $('#cake'), blowBtn = $('#blow');
let out = false;
function blowOut() {
    if (out) return;
    out = true; cake.classList.add('out'); cake.setAttribute('aria-label', 'کیک تولد با شمع‌های خاموش');
    blowBtn.textContent = 'دوباره روشنشون کن 🕯️';
    sfx.fan(); const { W, H } = FX.size(); FX.confetti(W / 2, H * .5, 170);
    show(FX.launch, [0, 350, 750, 1200]); toast('آرزو کن! ✨ (ایشالا مدرسه تعطیل شه 😂)', 3200);
}
function relight() {
    out = false; cake.classList.remove('out'); cake.setAttribute('aria-label', 'کیک تولد با سه شمع روشن');
    blowBtn.textContent = 'فوت کن! 🎂';
}
blowBtn.addEventListener('click', e => { e.stopPropagation(); out ? relight() : blowOut(); });
cake.addEventListener('pointerdown', e => { e.stopPropagation(); out ? relight() : blowOut(); });
$('#fire').addEventListener('click', e => { e.stopPropagation(); show(FX.launch, [0, 300, 650]); });

/* blow into the microphone (asks permission; falls back to tapping) */
$('#mic').addEventListener('click', async e => {
    e.stopPropagation();
    if (out) { toast('اول شمع‌ها رو روشن کن 🕯️'); return; }
    try {
        const st = await navigator.mediaDevices.getUserMedia({ audio: true });
        const a = ac(); if (!a) { st.getTracks().forEach(t => t.stop()); return; }
        const src = a.createMediaStreamSource(st), an = a.createAnalyser(), buf = new Uint8Array(512);
        an.fftSize = 512; src.connect(an);
        let hot = 0, ticks = 0; toast('به میکروفون فوت کن… 🌬️', 4500);
        const id = setInterval(() => {
            an.getByteTimeDomainData(buf);
            let s = 0; for (let i = 0; i < buf.length; i++) { const v = (buf[i] - 128) / 128; s += v * v; }
            hot = Math.sqrt(s / buf.length) > .16 ? hot + 1 : 0; ticks++;
            if (hot >= 4 || ticks > 120) {
                clearInterval(id); st.getTracks().forEach(t => t.stop()); src.disconnect();
                if (hot >= 4) blowOut(); else toast('نشنیدم! روی کیک بزن 😅');
            }
        }, 60);
    } catch (err) { toast('میکروفون در دسترس نیست؛ روی کیک بزن 🙂'); }
});

/* tap anywhere else = a firework right there */
document.addEventListener('pointerdown', e => {
    if (!document.body.classList.contains('on')) return;
    if (e.target.closest('button, .balloon, .cake')) return;
    FX.explode(e.clientX, e.clientY);
});

/* ---------- gift ---------- */
$('#giftBtn').addEventListener('click', () => {
    ac(); const g = $('#gift'); g.classList.add('open'); sfx.chime();
    setTimeout(() => {
        $('#flash').classList.add('go');
        const { W, H } = FX.size(); FX.confetti(W / 2, H / 2, 180);
        g.classList.add('gone'); document.body.classList.add('on');
        show(FX.launch, [300, 650, 1000]);
        sfx.fan();
        setTimeout(spawnBalloon, 500);
        balloonTimer = setInterval(spawnBalloon, 1100);
    }, 650);
}, { once: true });
</script>
